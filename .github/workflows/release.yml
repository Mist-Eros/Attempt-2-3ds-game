name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: devkitpro/devkitarm:latest
      options: --user root
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install audio codec (Tremor Ogg Vorbis music decoder)
        run: dkp-pacman -S --noconfirm --needed 3ds-libvorbisidec

      - name: build
        run: make

      - name: package
        run: zip -j ElementalDefense.3dsx.zip ElementalDefense.3dsx

      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Elemental Defense ${{ github.ref_name }}
          body: |
            Elemental Defense for the Nintendo 3DS - a maze-building tower defense with a
            Borderlands-style damage model.

            - build towers ON the road: the creeps recalculate their route (BFS shortest path)
              after every build and sell
            - enemies are 1-3 concentric HP / SHIELD / ARMOR rings, destroyed outside-in
            - six towers: GUN, FIRE (stacking burn), SHOCK (stun), CORROSIVE (acid puddle),
              SLAG (+50% damage taken), EXPLOSIVE (AoE, 3x slower)
            - 25 waves, 10 upgrade levels, 20 lives, elite waves every 5th wave
            - touch controls on the bottom screen, d-pad + buttons fallback
            - Borderlands-style element-card title screen, chamfered gold in-game UI, five emblems
            - music streams the full original soundtrack through Tremor (2:08 menu / 4:07 game)
            - sound effects from the original game (audio needs DSP1 firmware; silent if missing)
            - custom Homebrew Launcher icon
            - runs at 60 fps in Azahar

            Download `ElementalDefense.3dsx` (or the zip), copy it to the `/3ds/` folder on your
            SD card, then launch it from the Homebrew Launcher.
          files: |
            ElementalDefense.3dsx
            ElementalDefense.3dsx.zip
